<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Canopy — Em preparação</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #203c33;
        background: #eef5f1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        background: white;
        border: 1px solid #d1e1d8;
        border-radius: 24px;
        padding: clamp(28px, 7vw, 56px);
        box-shadow: 0 24px 80px #2547390a;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 750;
        letter-spacing: -1px;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px 14px 14px 4px;
        color: white;
        background: #087c69;
        font-size: 25px;
      }
      .tag {
        color: #33624e;
        font-size: 12px;
        letter-spacing: 2px;
        font-weight: 700;
        margin-top: 40px;
      }
      h1 {
        font-size: clamp(30px, 5vw, 40px);
        line-height: 1.15;
        letter-spacing: -1px;
        margin: 18px 0;
      }
      p {
        color: #526b60;
        line-height: 1.65;
      }
      footer {
        margin-top: 32px;
        border-top: 1px solid #e5eee9;
        padding-top: 20px;
        color: #526b60;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">c</span>canopy.</div>
      <div class="tag">MONGODB WORKBENCH</div>
      <h1>Seu novo espaço para trabalhar com dados.</h1>
      <p>
        Estamos preparando o acesso ao Canopy. O cadastro será liberado após concluirmos a
        configuração dos serviços de confirmação de conta.
      </p>
      <footer>Em preparação · Cadastro ainda indisponível</footer>
    </main>
  </body>
</html>
