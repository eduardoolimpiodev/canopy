server {
    listen 80;
    server_name canopy.eduardoolimpio.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://canopy.eduardoolimpio.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name canopy.eduardoolimpio.com;

    ssl_certificate /etc/letsencrypt/live/canopy.eduardoolimpio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopy.eduardoolimpio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/canopy-status;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
    }

    location / {
        return 503;
    }
}
