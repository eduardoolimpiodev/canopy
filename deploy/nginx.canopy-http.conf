server {
    listen 80;
    server_name canopy.eduardoolimpio.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Canopy: configuracao de HTTPS em andamento.\n";
    }
}
