server {
    listen 80;
    server_name canopyworkbench.com www.canopyworkbench.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://canopyworkbench.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.canopyworkbench.com;
    ssl_certificate /etc/letsencrypt/live/canopyworkbench.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopyworkbench.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://canopyworkbench.com$request_uri;
}

server {
    listen 443 ssl;
    server_name canopyworkbench.com;
    ssl_certificate /etc/letsencrypt/live/canopyworkbench.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopyworkbench.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    location / {
        set $canopy_backend http://canopy-api:4310;
        proxy_pass $canopy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }
}
