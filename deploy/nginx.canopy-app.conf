server {
    listen 80;
    server_name canopy.eduardoolimpio.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://canopyworkbench.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name canopy.eduardoolimpio.com;

    ssl_certificate /etc/letsencrypt/live/canopy.eduardoolimpio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopy.eduardoolimpio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    location / {
        return 301 https://canopyworkbench.com$request_uri;
    }
}
